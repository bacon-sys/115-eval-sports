<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>指標 6-1｜村校聯運宣傳問卷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf6f2;--card:#fff;--ink:#2b2320;--ink-soft:#6b5c54;--line:#e2d6cb;--red:#a8322a;--earth:#8a6a4f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 20px 12px;gap:10px;max-width:1240px;width:100%;margin:0 auto}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;flex:0 0 auto}
.head .t{flex:1;min-width:240px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;color:var(--earth);font-weight:500;margin:0 0 1px}
h1{font-family:"Noto Serif TC",serif;font-size:1.32rem;font-weight:700;margin:0;line-height:1.3}
.sub{margin:2px 0 0;font-size:.9rem;color:var(--ink-soft)}
.toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:0 0 auto}
.toggle button{font:inherit;font-size:.88rem;font-weight:500;border:0;background:none;color:var(--ink-soft);padding:7px 16px;cursor:pointer;transition:.15s;white-space:nowrap}
.toggle button.active{background:var(--earth);color:#fff}
.toggle button:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.chart{flex:1;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px 4px}
.chart svg{display:block;width:100%;height:100%}
.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:0 0 auto}
.kpi{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.kpi div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--earth);border-radius:8px;padding:6px 13px}
.kpi b{display:block;font-size:1.12rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi span{font-size:.79rem;color:var(--ink-soft)}
a.full{flex:0 0 auto;font-size:.87rem;font-weight:500;text-decoration:none;color:#fff;background:var(--red);padding:9px 18px;border-radius:8px;white-space:nowrap}
a.full:hover{background:#8d2822}
a.full:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{font-size:.78rem;color:#a1907f;margin:0;flex:0 0 auto;padding-left:2px}
@media (max-width:640px){body{font-size:14px}h1{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="t">
      <p class="eyebrow">指標 6-1　部落互動與家長參與情形</p>
      <h1>村校聯運宣傳攤位問卷統計（有效問卷 98 份）</h1>
      <p class="sub" id="sub">部落居民與家長對學校推動文化課程之認同度達 96.9%，且無人持反對意見。</p>
    </div>
    <div class="toggle" role="group" aria-label="切換檢視">
      <button id="btnKpi" class="active" type="button">認同度</button>
      <button id="btnWho" type="button">受訪者組成</button>
    </div>
  </div>
  <div class="chart"><svg id="svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="村校聯運宣傳問卷統計圖"></svg></div>
  <p class="note">問卷於村校聯合運動會活動當日以線上表單填答蒐集，回收有效問卷 98 份；「來源部落」一題為選答，實際填答 80 份。</p>
  <div class="foot">
    <div class="kpi" id="kpi"></div>
    <a class="full" href="https://bacon-sys.github.io/115-eval-sports/" target="_blank" rel="noopener">開啟完整版報告 ↗</a>
  </div>
</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('svg'), W=1000, H=430;
  var BLUE='#3b6fa0', GREEN='#3a7d5e', OCHRE='#c98a2d', EARTH='#8a6a4f';

  /* 四項認同度題目：正向 / 中立 / 負向 */
  var AGREE=[
    {q:'攤位體驗感受',        opt:['很有趣，想多了解','還好','沒感覺'], v:[94,4,0], c:OCHRE},
    {q:'文化課程社區認同度',  opt:['認同','普通','不認同'],            v:[95,3,0], c:GREEN},
    {q:'實驗教育理解提升',    opt:['有，更了解了','還好','還是不清楚'], v:[91,6,1], c:BLUE},
    {q:'活動前知悉學校辦學',  opt:['知道','—','不知道'],                v:[89,0,9], c:EARTH}
  ];

  /* 受訪者組成 */
  var WHO=[
    {title:'身分別', items:[['部落居民',65],['家長',24],['其他',9]], c:[GREEN,'#7aa88e','#c9bfae']},
    {title:'來源部落', items:[['南山',42],['四季',24],['其他',8],['茂安',4],['英士',2]], c:[BLUE,'#7ba3c4','#c9bfae','#a9c2af','#d9c08a']}
  ];

  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function tx(x,y,s,o){var t=el('text',{x:x,y:y});for(var k in (o||{}))t.setAttribute(k,o[k]);t.textContent=s;return t;}
  function clear(){while(svg.firstChild)svg.removeChild(svg.firstChild);}
  function fit(){
    var b=svg.parentNode.getBoundingClientRect();
    if(b.width>4&&b.height>4) H=Math.max(230,Math.min(700,Math.round(W*b.height/b.width)));
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
  }

  function drawAgree(){
    fit(); clear();
    var top=16, bot=12, ML=192, MR=96;
    var pw=W-ML-MR, ph=H-top-bot, band=ph/AGREE.length;
    var bh=Math.min(38,band*0.42);

    AGREE.forEach(function(a,i){
      var cy=top+band*i+band*0.42;
      var pct=a.v[0]/98*100;
      svg.appendChild(tx(ML-14,cy+7,a.q,{'font-size':16,'font-weight':700,fill:'#4a3d35','text-anchor':'end'}));
      /* track */
      svg.appendChild(el('rect',{x:ML,y:cy-bh/2,width:pw,height:bh,rx:5,fill:'#f4ece3'}));
      var acc=0;
      var cols=[a.c,'#ded2c4','#c3ada6'];
      a.v.forEach(function(val,k){
        if(!val) return;
        var x0=ML+(acc/98)*pw, w=(val/98)*pw;
        svg.appendChild(el('rect',{x:x0,y:cy-bh/2,width:w,height:bh,fill:cols[k]}));
        if(w>34) svg.appendChild(tx(x0+w/2,cy+6,val,{'font-size':15,'font-weight':700,fill:k?'#5c4f46':'#fff','text-anchor':'middle'}));
        acc+=val;
      });
      svg.appendChild(el('rect',{x:ML,y:cy-bh/2,width:pw,height:bh,rx:5,fill:'none',stroke:'#efe6dc','stroke-width':1}));
      svg.appendChild(tx(ML+pw+12,cy+7,pct.toFixed(1)+'%',{'font-size':18,'font-weight':700,fill:a.c}));
      /* option legend under the bar */
      var lx=ML, ly=cy+bh/2+19;
      a.opt.forEach(function(o,k){
        if(o==='—') return;
        svg.appendChild(el('rect',{x:lx,y:ly-9,width:11,height:11,rx:2,fill:cols[k]}));
        var lab=o+'　'+a.v[k]+' 人';
        svg.appendChild(tx(lx+16,ly,lab,{'font-size':13,fill:'#8b7a6e'}));
        lx+=16+lab.length*12.4+18;
      });
    });
  }

  function drawWho(){
    fit(); clear();
    var top=18, bot=12, ML=104, MR=20;
    var pw=W-ML-MR, half=(H-top-bot)/2;

    WHO.forEach(function(gp,gi){
      var y0=top+half*gi;
      svg.appendChild(tx(4,y0+18,gp.title,{'font-size':16,'font-weight':700,fill:'#8a6a4f'}));
      var tot=gp.items.reduce(function(a,b){return a+b[1];},0);
      var bh=Math.min(52,half*0.30), cy=y0+half*0.36;
      var acc=0;
      gp.items.forEach(function(it,k){
        var x0=ML+(acc/tot)*pw, w=(it[1]/tot)*pw;
        svg.appendChild(el('rect',{x:x0,y:cy-bh/2,width:w,height:bh,fill:gp.c[k],stroke:'#fff','stroke-width':1.5}));
        if(w>46) svg.appendChild(tx(x0+w/2,cy+7,it[1],{'font-size':17,'font-weight':700,fill:'#fff','text-anchor':'middle'}));
        acc+=it[1];
      });
      /* labels below, wrapping to a second line when the row runs out of width */
      var lx=ML, ly=cy+bh/2+26;
      gp.items.forEach(function(it,k){
        var lab=it[0]+'　'+it[1]+' 人（'+(it[1]/tot*100).toFixed(1)+'%）';
        var wpx=18+lab.length*13.2+16;
        if(lx+wpx>W-14){ lx=ML; ly+=24; }
        svg.appendChild(el('rect',{x:lx,y:ly-11,width:13,height:13,rx:3,fill:gp.c[k]}));
        svg.appendChild(tx(lx+18,ly,lab,{'font-size':14,fill:'#6b5c54'}));
        lx+=wpx;
      });
      svg.appendChild(tx(4,cy+7,'n = '+tot,{'font-size':13,fill:'#a1907f'}));
    });
  }

  var KPI={
    kpi:[['98 份','有效問卷回收'],['96.9%','認同學校推動文化課程'],['0 人','表示不認同']],
    who:[['66.3%','受訪者為部落居民'],['24.5%','受訪者為學生家長'],['5 個部落','受訪者來源涵蓋範圍']]
  };
  var SUB={
    kpi:'部落居民與家長對學校推動文化課程之認同度達 96.9%，且無人持反對意見。',
    who:'受訪者以部落居民與家長為主，來源涵蓋南山、四季、茂安、英士等學區部落。'
  };
  function setKpi(m){
    var k=document.getElementById('kpi'); k.innerHTML='';
    KPI[m].forEach(function(p){
      var d=document.createElement('div');
      d.innerHTML='<b>'+p[0]+'</b><span>'+p[1]+'</span>';
      k.appendChild(d);
    });
    document.getElementById('sub').textContent=SUB[m];
  }

  var bK=document.getElementById('btnKpi'), bW=document.getElementById('btnWho'), cur='kpi';
  function mode(m){
    cur=m;
    if(m==='kpi') drawAgree(); else drawWho();
    setKpi(m);
    bK.classList.toggle('active',m==='kpi');
    bW.classList.toggle('active',m==='who');
  }
  bK.onclick=function(){mode('kpi');};
  bW.onclick=function(){mode('who');};
  var rt;
  window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){mode(cur);},120);});
  mode('kpi');
})();
</script>
</body>
</html>
